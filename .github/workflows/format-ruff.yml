name: ruff-format

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ruff-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          # Keep in sync with the ruff pin in pyproject.toml
          version: "0.17.2"
          args: "format --check"
          src: "laplace tests examples"
