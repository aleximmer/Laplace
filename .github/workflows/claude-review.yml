name: Claude review

# A maintainer requests a review by commenting "@claude review" on a pull request.
# The job runs in this repository with its secrets, so it also works for pull
# requests from forks. Claude fetches the diff through `gh` and reads the review
# guidance (CLAUDE.md, AGENTS.md) from the main branch, not from the PR.

on:
  issue_comment:
    types: [created]

jobs:
  review:
    if: >-
      github.event.issue.pull_request != null &&
      contains(github.event.comment.body, '@claude review') &&
      contains(fromJSON('["aleximmer", "edaxberger", "wiseodd", "runame"]'), github.event.comment.user.login)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: claude-review-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: >-
            /code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.issue.number }}
            A maintainer requested this review explicitly, so review the pull
            request even if Claude has already commented on it.
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
