name: Claude review

# A maintainer requests a review by commenting "@claude review" on a pull request.
# The job runs in this repository with its secrets, so it also works for pull
# requests from forks. Claude fetches the diff through `gh` and reads the review
# instructions (.claude/skills/pr-review/SKILL.md) and the guidance it checks
# against (CLAUDE.md, AGENTS.md) from the main branch, not from the PR.
#
# Both actions are pinned to a commit. To update one, resolve the new release
# tag to its commit SHA and change the trailing version comment with it.

on:
  issue_comment:
    types: [created]

jobs:
  review:
    if: >-
      github.event.issue.pull_request != null &&
      contains(github.event.comment.body, '@claude review') &&
      contains(fromJSON('["aleximmer", "edaxberger", "wiseodd", "runame"]'), github.event.comment.user.login)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: claude-review-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@d70510b174a1244958df0b03166a54912811f3e6 # v1.0.264
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "/pr-review ${{ github.repository }}/pull/${{ github.event.issue.number }}"
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
