site_name: laplace-torch

repo_url: https://github.com/aleximmer/laplace
repo_name: laplace
site_author: wiseodd
site_url: https://aleximmer.github.io/Laplace/
site_dir: site/laplace

nav:
  - Introduction: index.md
  - Developer's Guide: devs_guide.md
  - "Example: Regression": regression_example.py
  - "Example: ELLA and VaLLA": ella_valla_example.py
  - "Example: Calibration": calibration_example.py
  - "Example: GP Inference": calibration_gp_example.py
  - "Example: Decision-Making": expectation_example.py
  - "Example: Bayesian Optimization": bayesopt_example.py
  - "Example: Huggingface LLMs": huggingface_example.py
  - "Example: Language Modeling": lm_example.py
  - "Example: Diffusion Models": diffusion_example.py
  - "Example: Semantic Segmentation": segmentation_example.py
  - "Example: Reward Modeling": reward_modeling_example.py
  - "Example: Multi-Label Classification": multilabel_example.py
  - "Example: Soft Labels": soft_label_example.py
  - "Example: Noise per Output": multioutput_noise_example.py
  - "Example: Heteroscedastic Regression": heteroscedastic_example.py
  - API Reference:
      - Laplace Frontend: api_reference/laplace.md
      - ELLA: api_reference/ella.md
      - VaLLA: api_reference/valla.md
      - Laplace Options: api_reference/enums.md
      - Likelihoods: api_reference/likelihoods.md
      - Base Laplace: api_reference/baselaplace.md
      - Parametric Laplace: api_reference/parametriclaplace.md
      - Functional Laplace: api_reference/functionallaplace.md
      - Last-Layer Laplace: api_reference/lllaplace.md
      - Subnet Laplace: api_reference/subnetlaplace.md
      - Curvatures: api_reference/curvatures.md
      - Marglik Training Utils: api_reference/marglik_training.md
      - Utilities: api_reference/utils.md

theme:
  name: material
  logo: assets/laplace_logo_inv.png

  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.indexes
    - navigation.tracking
    - content.code.annotate
    - toc.follow
    - navigation.footer
    - navigation.top
    - content.code.copy
    - content.tabs.link

  palette:
    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      primary: black
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode

    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      primary: black
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      primary: black
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

markdown_extensions:
  - admonition
  - pymdownx.details
  - toc:
      permalink: "#"
  - pymdownx.snippets
  - pymdownx.magiclink
  - attr_list
  - md_in_html
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.keys
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true

hooks:
  - mkdocs_hooks.py

# The example pages live outside docs/, so `mkdocs serve` must watch them too
watch:
  - examples

plugins:
  - search
  - mkdocs-jupyter:
      include: ["*.py"]
      execute: false
  - mkdocstrings:
      enabled: true
      default_handler: python
      handlers:
        python:
          import:
            - https://docs.python.org/3/objects.inv
          options:
            docstring_style: numpy
            docstring_section_style: list
            # Overrides without a docstring show the base class's
            extensions:
              - griffe_inherited_docstrings
            docstring_options:
              ignore_init_summary: true
            # Hide private members and the internal ones listed in `INTERNAL` in
            # tests/test_public_api.py, which checks this list. `loss` and
            # `n_params_subnet` stay, since likelihoods and subnet masks expose them.
            filters:
              - "!^_[^_]"
              - "!^(H_facs|K_MM|Kinv|L|Sigma_inv|V|alpha|assemble_full_samples|batch_size|chol_precision|damping|data|dict_key_x|dict_key_y|dual_directions|enable_backprop|feature_gram|fit_history_|functional_variance_fast|generator|gp_kernel_prior_variance|independent_outputs|inducing_classes|inducing_locations|is_subset_params|log_det_posterior_precision|log_det_prior_precision|log_det_ratio|log_noise_variance|log_prior_precision|mc_softmax_samples|mean_subnet|mu|n_eigenvalues|n_layers|n_obs|n_obs_examples|n_subset|num_inducing|params|prior_precision_diag|scatter|seed|square_norm|subsample_size|train_loader)$"
            heading_level: 1
            members_order: source
            merge_init_into_class: true
            inherited_members: true
            parameter_headings: true
            separate_signature: true
            show_if_no_docstring: true
            show_labels: false
            show_root_heading: true
            show_signature_annotations: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            signature_crossrefs: true
            summary: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/aleximmer/laplace
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/laplace-torch/

extra_css:
  - css/mkdocstrings.css
  - css/notebooks.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
